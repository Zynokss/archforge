name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust gtk4 vte4 sudo pkgconf pciutils polkit curl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Arch package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$RELEASE_TAG" = "v$version"
          test "$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)" = "$version"
          useradd --create-home builder
          printf "%s\n" "PACKAGER='Zynokss <31770892+Zynokss@users.noreply.github.com>'" > /home/builder/.makepkg.conf
          chown builder:builder /home/builder/.makepkg.conf
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'cd "$GITHUB_WORKSPACE" && ./scripts/dist.sh && cd packaging && makepkg --noconfirm --cleanbuild && makepkg --noconfirm --cleanbuild -p PKGBUILD-cli'
          mkdir release
          cp packaging/archforge-"$version"-*.pkg.tar.zst packaging/archforge-"$version".tar.gz release/
          cp packaging/archforge-cli-"$version"-*.pkg.tar.zst release/
          cp release/archforge-"$version"-*-x86_64.pkg.tar.zst release/archforge-x86_64.pkg.tar.zst
          cp release/archforge-cli-"$version"-*-x86_64.pkg.tar.zst release/archforge-cli-x86_64.pkg.tar.zst
          cd release
          sha256sum *.pkg.tar.zst *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-package
          path: release/*
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arch-package
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "Arch Forge ${RELEASE_TAG#v}" --generate-notes --latest
  repository:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pacman-repository.yml
    secrets: inherit
