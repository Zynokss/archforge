[package]
name = "archforge"
version = "0.10.0"
edition = "2024"
description = "Native Arch Linux system and gaming utility"
authors = ["Zynokss"]
repository = "https://github.com/Zynokss/archforge"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
libc = "0.2"
serde_json = "1"
semver = "1"
tempfile = "3"
pulldown-cmark = "0.13.6"
scraper = "0.29.0"
vte4 = { version = "0.10.0", features = ["v0_76"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
