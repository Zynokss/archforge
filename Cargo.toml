[package]
name = "archforge"
version = "0.12.0"
edition = "2024"
default-run = "archforge"
description = "Native Arch Linux system and gaming utility"
authors = ["Zynokss"]
repository = "https://github.com/Zynokss/archforge"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:semver", "dep:pulldown-cmark", "dep:scraper", "dep:vte4"]

[[bin]]
name = "archforge"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "archforge-cli"
path = "src/cli_main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"], optional = true }
libc = "0.2"
serde_json = "1"
semver = { version = "1", optional = true }
tempfile = "3"
pulldown-cmark = { version = "0.13.6", optional = true }
scraper = { version = "0.29.0", optional = true }
vte4 = { version = "0.10.0", features = ["v0_76"], optional = true }
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "0.28.1"
signal-hook = "0.3.18"
strip-ansi-escapes = "0.2.1"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
